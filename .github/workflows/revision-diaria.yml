# Revisión diaria de mercado (M-09): descarga los cierres del S&P 500, detecta movimientos que
# cruzan los umbrales de `reglas_alerta` y registra eventos y alertas en Supabase de forma
# idempotente. El correo al cliente está APAGADO en el propio script por defecto
# (REVISION_ENVIAR_CORREO_CLIENTE) — este workflow no lo activa.
#
# Escribe en la base de datos de producción con la service role key: las credenciales viven en los
# secrets del repositorio, nunca en el código ni en este archivo.
#
# Se eligió GitHub Actions frente a Vercel Cron porque no necesita exponer ninguna ruta HTTP
# pública que proteger: el runner efímero recibe los secrets, ejecuta el script y desaparece.

name: Revisión diaria de mercado

on:
  schedule:
    # 22:15 UTC de lunes a viernes: tras el cierre de la bolsa de EE. UU. (20:00–21:00 UTC según
    # horario de verano/invierno). En fin de semana no hay cierres nuevos. GitHub interpreta el
    # cron en UTC y puede retrasarlo unos minutos si hay carga.
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

# El pipeline es idempotente, pero dos ejecuciones a la vez no aportan nada: se serializan.
concurrency:
  group: revision-diaria
  cancel-in-progress: false

# Solo hace falta leer el repositorio para el checkout. No escribe nada en GitHub.
permissions:
  contents: read

jobs:
  revision:
    name: Detectar y registrar alertas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm revision
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
